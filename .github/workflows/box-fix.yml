name: box-fix

# Maintenance the box occasionally needs, run deliberately and never on a push.
on:
  workflow_dispatch:
    inputs:
      job:
        description: what to fix
        required: true
        default: thumbnails
        type: choice
        options:
          - thumbnails
          - describe-sample
          - snapshot
          - redescribe
          - diag
          - restore
          - repro
          - nudge
          - repro-pending
          - cadence-test
          - errorlog
          - errored-rows
          - burst
          - vps-check
          - vps-setup
          - vps-point
          - vps-unpoint
          - parallel
          - vps-logs
      parallel:
        description: for job=parallel, the describe concurrency to force (0 removes the override)
        required: false
        default: '0'
        type: string

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: the key
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
        run: |
          if [ -z "$BOX_SSH_KEY" ]; then echo "BOX_SSH_KEY is not set." >&2; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$BOX_SSH_KEY" > ~/.ssh/hetzner_vgml
          chmod 600 ~/.ssh/hetzner_vgml
          ssh-keyscan -H 46.225.66.194 >> ~/.ssh/known_hosts 2>/dev/null

      # A quality snapshot: folder top-5s, search top-5s, field fill rates,
      # counts by prompt. Run before and after a re-describe so the analysis
      # is a diff of two files rather than an impression.
      - name: quality snapshot
        if: ${{ inputs.job == 'snapshot' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-quality-snapshot.php root@46.225.66.194:/tmp/vgml-snapshot.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=40 root@46.225.66.194 'bash -s' < tools/box-quality-snapshot.sh

      # Re-describes every picture under the current prompt, for real, and
      # waits for the background run to finish. Spends one credit per picture.
      - name: re-describe the library
        if: ${{ inputs.job == 'redescribe' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-redescribe.php root@46.225.66.194:/tmp/vgml-redescribe.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=80 root@46.225.66.194 'bash -s' < tools/box-redescribe.sh

      - name: what happened to the run (read-only)
        if: ${{ inputs.job == 'diag' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-run-diag.php root@46.225.66.194:/tmp/vgml-diag.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-run-diag.sh

      - name: restore the index after the failed run
        if: ${{ inputs.job == 'restore' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-restore.php root@46.225.66.194:/tmp/vgml-restore.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-restore.sh

      - name: reproduce the refusal through the plugin (up to 12 credits)
        if: ${{ inputs.job == 'repro' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-repro.php root@46.225.66.194:/tmp/vgml-repro.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-repro.sh

      - name: keep the background run moving (nudges cron every 10s)
        if: ${{ inputs.job == 'nudge' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-nudge.php root@46.225.66.194:/tmp/vgml-nudge.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=80 root@46.225.66.194 'bash -s' < tools/box-nudge.sh

      - name: describe the rows a run cannot get past, and say why
        if: ${{ inputs.job == 'repro-pending' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-repro-pending.php root@46.225.66.194:/tmp/vgml-rp.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no -o ServerAliveInterval=30 root@46.225.66.194 'bash -s' < tools/box-repro-pending.sh

      - name: measure background run speed (48 credits)
        if: ${{ inputs.job == 'cadence-test' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-cadence-test.php root@46.225.66.194:/tmp/vgml-cad.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=40 root@46.225.66.194 'bash -s' < tools/box-cadence-test.sh

      - name: read the PHP error log (read-only)
        if: ${{ inputs.job == 'errorlog' }}
        run: |
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-errorlog-read.sh

      - name: pull apart every row that carries an error
        if: ${{ inputs.job == 'errored-rows' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-row.php root@46.225.66.194:/tmp/vgml-row.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-row.sh

      - name: sixteen at once through the plugin, with status codes
        if: ${{ inputs.job == 'burst' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-burst.php root@46.225.66.194:/tmp/vgml-burst.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-burst.sh

      - name: what the box has for running the service (read-only)
        if: ${{ inputs.job == 'vps-check' }}
        run: |
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-vps-check.sh

      - name: install Node 20 and pm2 on the box (idempotent)
        if: ${{ inputs.job == 'vps-setup' }}
        run: |
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-vps-setup.sh

      - name: point the plugin at the service on the box (127.0.0.1:3100)
        if: ${{ inputs.job == 'vps-point' }}
        run: |
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-vps-point.sh

      - name: point the plugin back at Vercel
        if: ${{ inputs.job == 'vps-unpoint' }}
        run: |
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-vps-unpoint.sh

      - name: force the describe concurrency on the box
        if: ${{ inputs.job == 'parallel' }}
        run: |
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 "VGML_PARALLEL='${{ inputs.parallel }}' bash -s" < tools/box-parallel.sh

      - name: read the on-box service log (read-only)
        if: ${{ inputs.job == 'vps-logs' }}
        run: |
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-vps-logs.sh

      # Thirty pictures re-described so the new prompt can be judged on real
      # ones before six hundred are paid for. Writes nothing; the credits are
      # spent either way, because the service charges for the call.
      - name: describe thirty pictures again and show both
        if: ${{ inputs.job == 'describe-sample' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-describe-sample.php root@46.225.66.194:/tmp/vgml-sample.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=40 root@46.225.66.194 'bash -s' < tools/box-describe-sample.sh

      # Two thirds of the library had no thumbnail, so the media grid was
      # serving full-size originals and rescaling them in the browser. This
      # only fills in sizes that are missing; it never rewrites one that
      # already exists, so nothing that currently works can be made worse.
      - name: regenerate the missing thumbnails
        if: ${{ inputs.job == 'thumbnails' }}
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no \
            tools/box-thumbs-count.php root@46.225.66.194:/tmp/vgml-thumbs-count.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 root@46.225.66.194 \
            'bash -s' < tools/box-thumbnails.sh
