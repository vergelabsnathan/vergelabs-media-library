name: box-tune

# Give the test box the limits a real WordPress site needs.
#
# The script it runs lives in tools/box-tune.sh, so it can be read and changed
# like anything else rather than hiding inside a YAML string. Everything it
# does is additive and reversible.
on:
  workflow_dispatch:
    inputs:
      memory:
        description: 'PHP memory_limit'
        required: false
        default: '512M'
      uploads:
        description: 'upload_max_filesize and post_max_size'
        required: false
        default: '128M'

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: the key, from where it actually lives
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
        run: |
          if [ -z "$BOX_SSH_KEY" ]; then
            echo "BOX_SSH_KEY is not set; nothing can be changed." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$BOX_SSH_KEY" > ~/.ssh/hetzner_vgml
          chmod 600 ~/.ssh/hetzner_vgml
          ssh-keyscan -H 46.225.66.194 >> ~/.ssh/known_hosts 2>/dev/null

      - name: raise the limits
        env:
          MEM: ${{ github.event.inputs.memory }}
          UP: ${{ github.event.inputs.uploads }}
        run: |
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 \
            "MEM='${MEM}' UP='${UP}' bash -s" < tools/box-tune.sh
