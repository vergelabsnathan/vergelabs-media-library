name: box-diagnose

# Read-only questions about the box's own data, answered where the key lives.
on:
  workflow_dispatch:

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: the key
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
        run: |
          if [ -z "$BOX_SSH_KEY" ]; then echo "BOX_SSH_KEY is not set." >&2; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$BOX_SSH_KEY" > ~/.ssh/hetzner_vgml
          chmod 600 ~/.ssh/hetzner_vgml
          ssh-keyscan -H 46.225.66.194 >> ~/.ssh/known_hosts 2>/dev/null

      - name: what the index actually holds
        run: |
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 \
            'bash -s' < tools/box-diagnose-search.sh

      - name: whether the short vector finds what the long one would
        run: |
          # tools/ is deliberately not part of a deploy, so the measurement is
          # carried over on its own and removed again when it has answered.
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no \
            tools/box-projection-recall.php root@46.225.66.194:/tmp/vgml-recall.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 \
            'bash -s' < tools/box-projection-recall.sh

      - name: what a folder would actually collect
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no \
            tools/box-folder-quality.php root@46.225.66.194:/tmp/vgml-folders.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 \
            'bash -s' < tools/box-folder-quality.sh

      - name: whether the credit balance agrees with itself
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no tools/box-credits.php root@46.225.66.194:/tmp/vgml-credits.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 'bash -s' < tools/box-credits.sh

      # Costs one planning call. Not on the push path for that reason.
      - name: whether a folder plan comes back, and follows the instruction
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no \
            tools/box-plan-check.php root@46.225.66.194:/tmp/vgml-plan.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 \
            'bash -s' < tools/box-plan-check.sh

      - name: why the grid is slow when a folder is picked
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no             tools/box-grid-speed.php root@46.225.66.194:/tmp/vgml-grid.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194             'bash -s' < tools/box-grid-speed.sh

      # Re-files for real and undoes it again, so it is not on the push path.
      - name: whether a re-filing job gets through the whole library
        run: |
          scp -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no \
            tools/box-refile-check.php root@46.225.66.194:/tmp/vgml-refile.php
          ssh -i ~/.ssh/hetzner_vgml -o StrictHostKeyChecking=no root@46.225.66.194 \
            'bash -s' < tools/box-refile-check.sh
